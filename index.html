<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Expediciones con Lucio</title>
<meta name="description" content="Un destino cada semana, una misión cada día.">
<meta name="theme-color" content="#b85c38">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    --papel: #faf5ec;
    --papel-card: #ffffff;
    --tinta: #2e2a26;
    --tinta-suave: #7a7266;
    --acento: #b85c38;
    --acento-suave: #f3e2d8;
    --exito: #5a6e5a;
    --exito-suave: #e7efe7;
    --dorado: #c9a227;
    --borde: #e8e0d2;
    --sombra: 0 2px 12px rgba(46, 42, 36, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--papel); color: var(--tinta);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.55; padding-bottom: 90px; max-width: 560px; margin: 0 auto;
  }
  h1, h2, h3, .brand { font-family: Georgia, "Times New Roman", serif; }

  header { padding: 16px 20px 10px; display: flex; align-items: center; gap: 12px; }
  header .lucio-mini { width: 46px; height: 46px; flex: 0 0 46px; }
  header .hud { flex: 1; min-width: 0; }
  header .hud .fila1 { display: flex; justify-content: space-between; align-items: baseline; }
  header .hud .nivel { font-weight: 700; font-size: .85rem; }
  header .hud .racha { font-size: .78rem; color: var(--tinta-suave); }
  .xp-barra { height: 8px; background: #eee5d6; border-radius: 99px; overflow: hidden; margin-top: 4px; }
  .xp-barra > div { height: 100%; background: var(--acento); border-radius: 99px; transition: width .5s ease; }
  header .hud .xp-txt { font-size: .68rem; color: var(--tinta-suave); margin-top: 2px; }

  .demo-banner { margin: 0 20px 10px; padding: 8px 14px; border-radius: 10px; background: #fff3cd; border: 1px dashed #d4b106; font-size: .78rem; color: #6b5900; }

  main { padding: 0 20px; }
  .card { background: var(--papel-card); border: 1px solid var(--borde); border-radius: 16px; box-shadow: var(--sombra); padding: 20px; margin-bottom: 14px; }

  .exp-header { display: flex; align-items: center; gap: 14px; }
  .exp-emoji { font-size: 1.9rem; width: 58px; height: 58px; flex: 0 0 58px; display: flex; align-items: center; justify-content: center; background: var(--acento-suave); border-radius: 14px; }
  .exp-header h2 { font-size: 1.25rem; line-height: 1.2; }
  .exp-header p { font-size: .8rem; color: var(--tinta-suave); }

  .chip { display: inline-block; font-size: .7rem; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--acento); background: var(--acento-suave); border-radius: 999px; padding: 3px 12px; margin-bottom: 10px; }

  .btn { display: block; width: 100%; text-align: center; border: none; cursor: pointer; border-radius: 12px; padding: 14px; font-size: .95rem; font-weight: 700; font-family: inherit; text-decoration: none; color: var(--tinta); }
  .btn-primario { background: var(--acento); color: #fff; }
  .btn-primario:active { filter: brightness(.92); }
  .btn-exito { background: var(--exito); color: #fff; }
  .btn-secundario { background: none; border: 1.5px solid var(--borde); }
  .btn + .btn { margin-top: 10px; }

  /* Escenas */
  .escena-zona { min-height: 300px; display: flex; flex-direction: column; }
  .burbuja { border-radius: 16px; padding: 12px 16px; margin-bottom: 12px; max-width: 88%; animation: aparecer .35s ease; font-size: .95rem; }
  @keyframes aparecer { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .burbuja .quien { font-size: .68rem; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; margin-bottom: 3px; opacity: .75; }
  .b-lucio { background: var(--acento-suave); border-bottom-left-radius: 4px; align-self: flex-start; }
  .b-npc { background: #eee9dc; border-bottom-left-radius: 4px; align-self: flex-start; }
  .b-cami { background: var(--exito-suave); border-bottom-right-radius: 4px; align-self: flex-end; font-style: italic; }
  .escena-lucio { display: flex; justify-content: center; margin-bottom: 10px; }
  .escena-lucio svg { animation: flotar 3s ease-in-out infinite; }
  @keyframes flotar { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .opciones-decision .btn { text-align: left; }

  /* Minijuegos */
  .mj-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
  .mj-carta { border: 1.5px solid var(--borde); background: var(--papel); border-radius: 10px; padding: 10px 8px; font-size: .8rem; text-align: center; cursor: pointer; font-family: inherit; color: var(--tinta); min-height: 58px; display: flex; align-items: center; justify-content: center; }
  .mj-carta.sel { border-color: var(--acento); background: var(--acento-suave); font-weight: 600; }
  .mj-carta.ok { border-color: var(--exito); background: var(--exito-suave); opacity: .65; pointer-events: none; }
  .mj-carta.mal { animation: sacudir .35s; border-color: #c0392b; }
  @keyframes sacudir { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .mj-lista { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
  .mj-item { border: 1.5px solid var(--borde); background: var(--papel); border-radius: 10px; padding: 12px 14px; font-size: .85rem; text-align: left; cursor: pointer; font-family: inherit; color: var(--tinta); display: flex; gap: 10px; align-items: center; }
  .mj-item.ok { border-color: var(--exito); background: var(--exito-suave); pointer-events: none; }
  .mj-item.mal { animation: sacudir .35s; border-color: #c0392b; }
  .mj-item .num { width: 24px; height: 24px; flex: 0 0 24px; border-radius: 50%; background: var(--exito); color: #fff; font-size: .75rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }

  /* Recompensa */
  .recompensa { text-align: center; }
  .recompensa .grande { font-size: 3rem; animation: brincar .6s ease; }
  @keyframes brincar { 0% { transform: scale(0); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }
  .recompensa .xp-ganado { display: inline-block; margin-top: 8px; background: var(--acento-suave); color: var(--acento); font-weight: 700; border-radius: 999px; padding: 4px 16px; font-size: .9rem; }

  /* Charla */
  .charla-zona { display: flex; flex-direction: column; }
  .charla-preguntas .btn { text-align: left; font-weight: 600; font-size: .88rem; padding: 12px 14px; }

  /* Desafío */
  .vidas { text-align: center; font-size: 1.3rem; letter-spacing: 4px; margin-bottom: 10px; }
  .desafio-progreso { display: flex; gap: 4px; margin-bottom: 14px; }
  .desafio-progreso span { flex: 1; height: 5px; border-radius: 99px; background: var(--borde); }
  .desafio-progreso span.ok { background: var(--exito); }
  .desafio-progreso span.mal { background: #c0392b; }
  .opcion { display: block; width: 100%; text-align: left; cursor: pointer; background: var(--papel); border: 1.5px solid var(--borde); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; font-size: .9rem; font-family: inherit; color: var(--tinta); }
  .opcion.correcta { border-color: var(--exito); background: var(--exito-suave); font-weight: 600; }
  .opcion.incorrecta { border-color: #c0392b; background: #f9e5e2; }

  /* Mapa semana */
  .parada { display: flex; align-items: center; gap: 14px; background: var(--papel-card); border: 1px solid var(--borde); border-radius: 14px; padding: 13px 16px; margin-bottom: 0; cursor: pointer; }
  .parada.bloqueada { opacity: .5; cursor: default; }
  .conector { width: 2px; height: 14px; background: var(--borde); margin-left: 36px; }
  .parada .icono { width: 40px; height: 40px; flex: 0 0 40px; border-radius: 50%; background: var(--acento-suave); display: flex; align-items: center; justify-content: center; font-size: 1.05rem; }
  .parada.hecha .icono { background: var(--exito); }
  .parada .info { flex: 1; min-width: 0; }
  .parada .info .nombre { font-weight: 600; font-size: .9rem; }
  .parada .info .sub { font-size: .76rem; color: var(--tinta-suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Pasaporte */
  .stats { display: flex; gap: 10px; margin-bottom: 14px; }
  .stat { flex: 1; text-align: center; background: var(--papel-card); border: 1px solid var(--borde); border-radius: 14px; padding: 12px 6px; }
  .stat .n { font-size: 1.35rem; font-family: Georgia, serif; }
  .stat .l { font-size: .68rem; color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .6px; }
  .souvenir-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; }
  .souvenir { text-align: center; background: var(--papel); border: 1px solid var(--borde); border-radius: 12px; padding: 10px 6px; }
  .souvenir .e { font-size: 1.6rem; }
  .souvenir .t { font-size: .66rem; color: var(--tinta-suave); line-height: 1.3; margin-top: 4px; }
  .ropero { display: flex; gap: 10px; }
  .traje { flex: 1; text-align: center; border: 2px solid var(--borde); border-radius: 14px; padding: 10px 4px; cursor: pointer; background: var(--papel); }
  .traje.activo { border-color: var(--acento); background: var(--acento-suave); }
  .traje.bloqueado { opacity: .45; cursor: default; }
  .traje .t { font-size: .68rem; margin-top: 4px; color: var(--tinta-suave); }
  .etiqueta { font-size: .7rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--tinta-suave); margin-bottom: 10px; }

  .excav-card { border: 1px solid var(--borde); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
  .excav-card > button { width: 100%; text-align: left; background: var(--papel); border: none; padding: 13px 16px; font-family: inherit; font-size: .9rem; font-weight: 700; cursor: pointer; color: var(--tinta); display: flex; justify-content: space-between; gap: 8px; }
  .excav-card .cuerpo { padding: 4px 16px 14px; font-size: .9rem; background: var(--papel-card); }

  .vacio { text-align: center; padding: 36px 20px; color: var(--tinta-suave); }
  .vacio .grande { font-size: 2.6rem; margin-bottom: 10px; }

  nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 560px; margin: 0 auto; background: rgba(255,255,255,.96); backdrop-filter: blur(8px); border-top: 1px solid var(--borde); display: flex; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
  nav button { flex: 1; background: none; border: none; cursor: pointer; font-family: inherit; padding: 8px 4px; border-radius: 12px; color: var(--tinta-suave); font-size: .7rem; font-weight: 600; }
  nav button .ic { display: block; font-size: 1.3rem; margin-bottom: 2px; }
  nav button.activo { color: var(--acento); background: var(--acento-suave); }
</style>
</head>
<body>
<header>
  <div class="lucio-mini" id="lucio-header"></div>
  <div class="hud">
    <div class="fila1"><span class="nivel" id="hud-nivel"></span><span class="racha" id="hud-racha"></span></div>
    <div class="xp-barra"><div id="hud-xp-fill" style="width:0%"></div></div>
    <div class="xp-txt" id="hud-xp-txt"></div>
  </div>
</header>
<div id="demo-banner"></div>
<main id="main"></main>
<nav id="nav">
  <button id="nav-hoy" onclick="irA('hoy')"><span class="ic">🧭</span>Hoy</button>
  <button id="nav-semana" onclick="irA('semana')"><span class="ic">🗺️</span>Expedición</button>
  <button id="nav-pasaporte" onclick="irA('pasaporte')"><span class="ic">📔</span>Pasaporte</button>
</nav>

<script src="expediciones.js"></script>
<script>
/* ================= Estado ================= */
const CLAVE = "lucio_estado_v2";
const DEMO = new URLSearchParams(location.search).has("demo");
const DIAS_NOMBRE = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
const NIVELES = ["Curiosa", "Aprendiz de viajera", "Trotamundos", "Exploradora", "Cartógrafa", "Gran Expedicionaria", "Leyenda del Pasaporte"];
const ACCESORIOS = { ninguno: "Al natural", panoleta: "Pañoleta de exploradora", kasa: "Kasa de paja japonesa" };
const XP_NIVEL = 300;

let estado = cargar();
let vista = "hoy";
let diaVisto = null;
let juego = null;

function cargar() {
  let e;
  try { e = JSON.parse(localStorage.getItem(CLAVE)) || {}; } catch (err) { e = {}; }
  e.xp = e.xp || 0;
  e.racha = e.racha || { n: 0, ultima: null };
  e.misiones = e.misiones || {};
  e.souvenirs = e.souvenirs || [];
  e.sellos = e.sellos || [];
  e.accesorios = e.accesorios || ["ninguno"];
  e.accesorioActivo = e.accesorioActivo || "ninguno";
  e.prologo = e.prologo || false;
  e.insigniasV1 = e.insigniasV1 || [];
  if (!e.migradoV1) {
    try {
      const v1 = JSON.parse(localStorage.getItem("sensei_estado_v1"));
      if (v1) {
        e.xp += Object.values(v1.leidas || {}).filter(Boolean).length * 20;
        e.xp += (v1.insignias || []).length * 50;
        e.insigniasV1 = v1.insignias || [];
        if (v1.racha && v1.racha.n > e.racha.n) e.racha = v1.racha;
      }
    } catch (err) {}
    e.migradoV1 = true;
  }
  return e;
}
function guardar() { localStorage.setItem(CLAVE, JSON.stringify(estado)); }
function darXP(n) { estado.xp += n; guardar(); pintarHUD(); }
function nivel() { return Math.min(Math.floor(estado.xp / XP_NIVEL) + 1, NIVELES.length); }
function nombreNivel() { return NIVELES[nivel() - 1]; }

/* ================= Fechas ================= */
function hoy() { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function parseFecha(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function fechaISO(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function diasEntre(a, b) { return Math.round((b - a) / 86400000); }

function actualizarRacha() {
  const h = fechaISO(hoy());
  if (estado.racha.ultima === h) return;
  const ayer = new Date(hoy()); ayer.setDate(ayer.getDate() - 1);
  estado.racha.n = (estado.racha.ultima === fechaISO(ayer)) ? estado.racha.n + 1 : 1;
  estado.racha.ultima = h;
  guardar();
}

/* ================= Expedición ================= */
function expActual() {
  const exps = (window.EXPEDICIONES || []).slice().sort((a, b) => b.inicio.localeCompare(a.inicio));
  const t = hoy();
  for (const x of exps) { const ini = parseFecha(x.inicio); if (t >= ini && diasEntre(ini, t) <= 6) return x; }
  for (const x of exps) if (t >= parseFecha(x.inicio)) return x;
  return exps[exps.length - 1] || null;
}
function idxHoy(exp) { return diasEntre(parseFecha(exp.inicio), hoy()); }
function abierta(exp, i) { return DEMO || idxHoy(exp) >= i; }
function kMision(exp, i) { return exp.id + ":" + i; }
function mision(exp, i) { const k = kMision(exp, i); estado.misiones[k] = estado.misiones[k] || {}; return estado.misiones[k]; }

/* ================= Lucio SVG ================= */
function lucioSVG(px, accesorio) {
  const a = accesorio || estado.accesorioActivo;
  let extra = "";
  if (a === "panoleta") extra = '<path d="M38 74 Q60 88 82 74 L60 96 Z" fill="#c0392b"/><path d="M38 74 Q60 86 82 74" stroke="#96281b" stroke-width="2" fill="none"/>';
  if (a === "kasa") extra = '<path d="M18 38 L60 8 L102 38 Q60 50 18 38 Z" fill="#d9b45c" stroke="#b6913d" stroke-width="2"/><path d="M60 8 L60 20" stroke="#b6913d" stroke-width="2"/>';
  return '<svg viewBox="0 0 120 120" width="' + px + '" height="' + px + '" role="img" aria-label="Lucio">' +
    '<ellipse cx="60" cy="112" rx="34" ry="6" fill="rgba(46,42,36,.08)"/>' +
    '<path d="M88 78 Q112 74 108 52" stroke="#e88f3c" stroke-width="9" fill="none" stroke-linecap="round"/>' +
    '<ellipse cx="60" cy="82" rx="30" ry="28" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.5"/>' +
    '<path d="M60 56 a30 28 0 0 1 30 26 L60 82 Z" fill="#e88f3c"/>' +
    '<circle cx="60" cy="46" r="24" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.5"/>' +
    '<path d="M40 32 L34 14 L50 24 Z" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.5"/>' +
    '<path d="M80 32 L86 14 L70 24 Z" fill="#e88f3c"/>' +
    '<path d="M60 24 a24 24 0 0 1 22 16 L60 46 Z" fill="#e88f3c"/>' +
    '<circle cx="51" cy="46" r="3" fill="#2e2a26"/><circle cx="69" cy="46" r="3" fill="#2e2a26"/>' +
    '<path d="M57 53 q3 3 6 0" stroke="#2e2a26" stroke-width="1.8" fill="none" stroke-linecap="round"/>' +
    '<path d="M55 51 l2 2 M65 51 l-2 2" stroke="#2e2a26" stroke-width="1.4" stroke-linecap="round"/>' +
    '<path d="M30 48 h12 M30 53 h11 M78 48 h12 M79 53 h11" stroke="#c9c2b2" stroke-width="1.4" stroke-linecap="round"/>' +
    extra + '</svg>';
}

/* ================= Render base ================= */
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
function irA(v) { vista = v; diaVisto = null; juego = null; render(); window.scrollTo(0, 0); }

function pintarHUD() {
  document.getElementById("lucio-header").innerHTML = lucioSVG(46);
  document.getElementById("hud-nivel").textContent = "Nv. " + nivel() + " · " + nombreNivel();
  document.getElementById("hud-racha").textContent = "🔥 " + estado.racha.n + (estado.racha.n === 1 ? " día" : " días");
  const enNivel = estado.xp % XP_NIVEL;
  document.getElementById("hud-xp-fill").style.width = Math.round((enNivel / XP_NIVEL) * 100) + "%";
  document.getElementById("hud-xp-txt").textContent = enNivel + " / " + XP_NIVEL + " xp para el siguiente nivel";
}

function render() {
  pintarHUD();
  document.getElementById("demo-banner").innerHTML = DEMO ? '<div class="demo-banner">🔧 Modo demo: toda la expedición desbloqueada.</div>' : "";
  ["hoy", "semana", "pasaporte"].forEach(v => document.getElementById("nav-" + v).classList.toggle("activo", v === vista));
  document.getElementById("nav").style.display = juego ? "none" : "flex";
  const main = document.getElementById("main");
  if (juego) { main.innerHTML = vistaJuego(); return; }
  const exp = expActual();
  if (!exp) { main.innerHTML = '<div class="vacio"><div class="grande">🌱</div>Aún no hay expediciones.</div>'; return; }
  if (vista === "hoy") main.innerHTML = vistaHoy(exp);
  else if (vista === "semana") main.innerHTML = vistaSemana(exp);
  else main.innerHTML = vistaPasaporte();
}

function cardExp(exp) {
  return '<div class="card"><div class="exp-header"><div class="exp-emoji">' + exp.emoji + '</div>' +
    '<div><h2>Expedición: ' + esc(exp.destino) + '</h2><p>' + esc(exp.subtitulo) + '</p></div></div></div>';
}

/* ================= Vista Hoy ================= */
function vistaHoy(exp) {
  const idx = idxHoy(exp);
  let i = (diaVisto !== null) ? diaVisto : Math.min(Math.max(idx, 0), 6);
  let html = cardExp(exp);

  if (!estado.prologo) {
    html += '<div class="card recompensa"><div style="margin-bottom:6px">' + lucioSVG(110) + '</div>' +
      '<h2 style="font-size:1.2rem;margin-bottom:6px;">Lucio quiere decirte algo…</h2>' +
      '<p style="font-size:.88rem;color:var(--tinta-suave);margin-bottom:14px;">Tu gato lleva años guardando un secreto. Escúchalo antes de partir.</p>' +
      '<button class="btn btn-primario" onclick="jugarPrologo()">▶ Jugar el prólogo</button></div>';
    if (!DEMO && idx < 0) return html;
  }

  if (!DEMO && idx < 0) {
    const faltan = -idx;
    html += '<div class="vacio"><div class="grande">🧳</div>La expedición a ' + esc(exp.destino) + ' sale en ' + faltan + (faltan === 1 ? " día" : " días") + '.<br>Lucio ya empacó las sardinas.</div>';
    return html;
  }
  if (!DEMO && idx > 6 && diaVisto === null) {
    html += '<div class="vacio"><div class="grande">🎉</div>Expedición completada. Lucio está planeando el próximo destino…<br><br>Repasa el viaje en 🗺️.</div>';
    return html;
  }
  if (!abierta(exp, i)) {
    html += '<div class="vacio"><div class="grande">🔒</div>Esta parada se abre el ' + DIAS_NOMBRE[i].toLowerCase() + '. Los gatos sabemos esperar. Tú también puedes.</div>';
    return html;
  }
  if (i <= 4) return html + cardMision(exp, i);
  if (i === 5) return html + cardDesafio(exp);
  return html + cardCampamento(exp);
}

function cardMision(exp, i) {
  const d = exp.dias[i];
  const m = mision(exp, i);
  let html = '<div class="card"><span class="chip">' + DIAS_NOMBRE[i] + ' · Misión ' + (i + 1) + ' de 5</span>' +
    '<h2 style="font-size:1.3rem;margin-bottom:10px;">' + esc(d.titulo) + '</h2>';
  if (!m.completada) {
    html += '<p style="font-size:.88rem;color:var(--tinta-suave);margin-bottom:14px;">Una misión jugable de ~5 minutos con Lucio. Al completarla ganas XP y el souvenir del día: ' + d.souvenir.emoji + '</p>' +
      '<button class="btn btn-primario" onclick="jugarMision(' + i + ')">▶ Jugar la misión</button>';
  } else {

/* ================= Juego: escenas ================= */
function jugarPrologo() { juego = { tipo: "escenas", esPrologo: true, nodos: window.PROLOGO.escenas, i: 0, historial: [] }; avanzarHasta(); render(); window.scrollTo(0, 0); }
function jugarMision(i) { const exp = expActual(); juego = { tipo: "escenas", exp, dia: i, nodos: exp.dias[i].escenas, i: 0, historial: [] }; avanzarHasta(); render(); window.scrollTo(0, 0); }

function nodoIdx(id) { return juego.nodos.findIndex(n => n.id === id); }
function avanzarHasta() {
  while (juego.i < juego.nodos.length) {
    const n = juego.nodos[juego.i];
    if (n.salta !== undefined) { juego.i = nodoIdx(n.salta); continue; }
    if (n.decision) { juego.esperando = "decision"; return; }
    juego.historial.push(n);
    juego.esperando = "continuar";
    return;
  }
  juego.esperando = "fin";
}
function continuar() { juego.i++; avanzarHasta(); if (juego.esperando === "fin") return finEscenas(); render(); window.scrollTo(0, document.body.scrollHeight); }
function decidir(ir) { juego.i = nodoIdx(ir); avanzarHasta(); render(); window.scrollTo(0, document.body.scrollHeight); }

function finEscenas() {
  if (juego.esPrologo) {
    if (!estado.prologo) {
      estado.prologo = true;
      estado.souvenirs.push({ expId: "prologo", emoji: window.PROLOGO.souvenir.emoji, nombre: window.PROLOGO.souvenir.nombre, fecha: fechaISO(hoy()) });
      if (!estado.accesorios.includes(window.PROLOGO.accesorio)) estado.accesorios.push(window.PROLOGO.accesorio);
      estado.accesorioActivo = window.PROLOGO.accesorio;
      darXP(window.PROLOGO.xp);
    }
    juego = { tipo: "recompensa", titulo: "¡Prólogo completado!", emoji: "✈️", lineas: ["Souvenir: " + window.PROLOGO.souvenir.nombre, "Lucio desbloqueó su pañoleta de exploradora 🧣", "+" + window.PROLOGO.xp + " xp"] };
    guardar(); render(); window.scrollTo(0, 0); return;
  }
  const m = mision(juego.exp, juego.dia);
  if (m.completada) { const dia = juego.dia; juego = null; diaVisto = dia; render(); window.scrollTo(0, 0); return; }
  const d = juego.exp.dias[juego.dia];
  juego = { tipo: "minijuego", exp: juego.exp, dia: juego.dia, mj: d.minijuego, errores: 0, sel: null, hechas: [], colocados: 0, barajado: null };
  render(); window.scrollTo(0, 0);
}

function vistaJuego() {
  if (juego.tipo === "escenas") return vistaEscenas();
  if (juego.tipo === "minijuego") return vistaMinijuego();
  if (juego.tipo === "recompensa") return vistaRecompensa();
  if (juego.tipo === "excavacion") return vistaExcavacion();
  if (juego.tipo === "charla") return vistaCharla();
  if (juego.tipo === "desafio") return vistaDesafio();
  return "";
}

function vistaEscenas() {
  const titulo = juego.esPrologo ? window.PROLOGO.titulo : juego.exp.dias[juego.dia].titulo;
  let html = '<div class="card"><span class="chip">' + esc(titulo) + '</span>' +
    '<div class="escena-lucio">' + lucioSVG(96) + '</div><div class="escena-zona">';
  const ultimos = juego.historial.slice(-4);
  ultimos.forEach(n => {
    const clase = n.de === "lucio" ? "b-lucio" : n.de === "cami" ? "b-cami" : "b-npc";
    const quien = n.de === "lucio" ? "Lucio" : n.de === "cami" ? "Tú" : n.nombre;
    html += '<div class="burbuja ' + clase + '"><div class="quien">' + esc(quien) + '</div>' + esc(n.texto) + '</div>';
  });
  html += '</div>';
  if (juego.esperando === "decision") {
    const n = juego.nodos[juego.i];
    html += '<div class="opciones-decision">';
    n.decision.forEach(o => { html += '<button class="btn btn-secundario" onclick="decidir(\'' + o.ir + '\')">👉 ' + esc(o.texto) + '</button>'; });
    html += '</div>';
  } else {
    html += '<button class="btn btn-primario" onclick="continuar()">Continuar ▸</button>';
  }
  html += '<button class="btn btn-secundario" onclick="juego=null;render()">✕ Salir</button></div>';
  return html;
}

/* ================= Minijuegos ================= */
function barajar(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }

function vistaMinijuego() {
  const mj = juego.mj;
  let html = '<div class="card"><span class="chip">Prueba del día</span>' +
    '<h2 style="font-size:1.1rem;margin-bottom:4px;">' + esc(mj.instruccion) + '</h2>' +
    '<p style="font-size:.78rem;color:var(--tinta-suave);">Errores: ' + juego.errores + '</p>';
  if (mj.tipo === "parejas") {
    if (!juego.barajado) {
      juego.barajado = barajar(mj.pares.flatMap((p, pi) => [{ t: p[0], par: pi }, { t: p[1], par: pi }]));
    }
    html += '<div class="mj-grid">';
    juego.barajado.forEach((c, ci) => {
      const ok = juego.hechas.includes(c.par);
      const sel = juego.sel === ci;
      html += '<button class="mj-carta' + (ok ? " ok" : sel ? " sel" : "") + '" id="mjc' + ci + '" onclick="tocarCarta(' + ci + ')">' + esc(c.t) + '</button>';
    });
    html += '</div>';
  } else {
    if (!juego.barajado) {
      juego.barajado = barajar(mj.items.map((t, oi) => ({ t, orden: oi })));
      juego.colocados = 0;
    }
    html += '<div class="mj-lista">';
    juego.barajado.forEach((it, ii) => {
      const ok = it.orden < juego.colocados;
      html += '<button class="mj-item' + (ok ? " ok" : "") + '" id="mji' + ii + '" onclick="tocarItem(' + ii + ')">' +
        (ok ? '<span class="num">' + (it.orden + 1) + '</span>' : '<span class="num" style="background:var(--borde);color:var(--tinta-suave)">?</span>') + esc(it.t) + '</button>';
    });
    html += '</div><p style="font-size:.78rem;color:var(--tinta-suave);text-align:center;">Toca los pasos en orden, del primero al último.</p>';
  }
  return html + '</div>';
}
function tocarCarta(ci) {
  const c = juego.barajado[ci];
  if (juego.hechas.includes(c.par)) return;
  if (juego.sel === null) { juego.sel = ci; render(); return; }
  if (juego.sel === ci) { juego.sel = null; render(); return; }
  const otra = juego.barajado[juego.sel];
  if (otra.par === c.par) {
    juego.hechas.push(c.par); juego.sel = null;
    if (juego.hechas.length === juego.mj.pares.length) return completarMision();
    render();
  } else {
    juego.errores++;
    const el = document.getElementById("mjc" + ci); if (el) { el.classList.add("mal"); }
    setTimeout(() => { juego.sel = null; render(); }, 380);
  }
}
function tocarItem(ii) {
  const it = juego.barajado[ii];
  if (it.orden < juego.colocados) return;
  if (it.orden === juego.colocados) {
    juego.colocados++;
    if (juego.colocados === juego.mj.items.length) return completarMision();
    render();
  } else {
    juego.errores++;
    const el = document.getElementById("mji" + ii); if (el) el.classList.add("mal");
    setTimeout(render, 380);
  }
}

function completarMision() {
  const exp = juego.exp, dia = juego.dia;
  const d = exp.dias[dia];
  const m = mision(exp, dia);
  const bonus = juego.errores === 0 ? 40 : juego.errores <= 2 ? 25 : 15;
  m.completada = true;
  estado.souvenirs.push({ expId: exp.id, emoji: d.souvenir.emoji, nombre: d.souvenir.nombre, fecha: fechaISO(hoy()) });
  darXP(80 + bonus);
  guardar();
  juego = { tipo: "recompensa", exp, dia, titulo: "¡Misión completada!", emoji: d.souvenir.emoji,
    lineas: ["Souvenir: " + d.souvenir.nombre, juego.errores === 0 ? "Prueba perfecta 🎯 +40 xp extra" : "+" + bonus + " xp extra por la prueba", "+80 xp de misión", "Se desbloqueó la excavación ⛏️ y la charla con Lucio 💬"] };
  render(); window.scrollTo(0, 0);
}

  });

function preguntar(qi, esExtra) {

/* ================= Desafío ================= */
function jugarDesafio() { const exp = expActual(); juego = { tipo: "desafio", exp, i: 0, vidas: exp.desafio.vidas, resultados: [], resuelto: null }; render(); window.scrollTo(0, 0); }
function vistaDesafio() {
  const df = juego.exp.desafio;
  if (juego.i >= df.preguntas.length || juego.vidas === 0) return vistaFinDesafio();
  const p = df.preguntas[juego.i];
  let html = '<div class="card"><span class="chip">⚔️ ' + esc(df.titulo) + '</span>' +
    '<div class="vidas">' + "❤️".repeat(juego.vidas) + "🖤".repeat(df.vidas - juego.vidas) + '</div>' +
    '<div class="desafio-progreso">' + df.preguntas.map((_, i) => '<span class="' + (juego.resultados[i] === true ? "ok" : juego.resultados[i] === false ? "mal" : "") + '"></span>').join("") + '</div>' +
    '<h3 style="font-size:1rem;margin-bottom:12px;">' + (juego.i + 1) + '. ' + esc(p.q) + '</h3>';
  p.opciones.forEach((o, oi) => {
    let clase = "";
    if (juego.resuelto !== null) { if (oi === p.correcta) clase = " correcta"; else if (oi === juego.resuelto && oi !== p.correcta) clase = " incorrecta"; }
    html += '<button class="opcion' + clase + '" onclick="responderDesafio(' + oi + ')"' + (juego.resuelto !== null ? " disabled" : "") + '>' + esc(o) + '</button>';
  });
  if (juego.resuelto !== null) html += '<button class="btn btn-primario" onclick="siguientePregunta()">Siguiente ▸</button>';
  html += '<button class="btn btn-secundario" onclick="juego=null;render()">✕ Rendirse (Lucio fingirá no juzgarte)</button></div>';
  return html;
}
function responderDesafio(oi) {
  if (juego.resuelto !== null) return;
  const p = juego.exp.desafio.preguntas[juego.i];
  juego.resuelto = oi;
  const bien = oi === p.correcta;
  juego.resultados[juego.i] = bien;
  if (!bien) juego.vidas--;
  render();
}
function siguientePregunta() { juego.i++; juego.resuelto = null; render(); window.scrollTo(0, 0); }
function vistaFinDesafio() {
  const exp = juego.exp;
  const gano = juego.vidas > 0;
  if (gano && !estado.sellos.some(s => s.expId === exp.id)) {

  }
  return '<div class="card recompensa"><div class="grande">😿</div>' +
    '<h2 style="margin-bottom:8px;">El Shōgun ganó esta vez</h2>' +
    '<p style="font-size:.9rem;color:var(--tinta-suave);">Lucio dice que hasta los mejores exploradores caen. Repasa las excavaciones y vuelve.</p>' +

    '<div class="stat"><div class="n">🔥 ' + estado.racha.n + '</div><div class="l">racha</div></div>' +
    '<div class="stat"><div class="n">' + estado.souvenirs.length + '</div><div class="l">souvenirs</div></div>' +
    '<div class="stat"><div class="n">' + estado.sellos.length + '</div><div class="l">sellos</div></div></div>';

  html += '<div class="card"><div class="etiqueta">👒 Guardarropa de Lucio</div><div class="ropero">';
  Object.keys(ACCESORIOS).forEach(id => {
    const tiene = estado.accesorios.includes(id);
    const activo = estado.accesorioActivo === id;
    html += '<div class="traje' + (activo ? " activo" : "") + (tiene ? "" : " bloqueado") + '"' + (tiene ? ' onclick="vestir(\'' + id + '\')"' : "") + '>' +
      lucioSVG(64, id) + '<div class="t">' + (tiene ? esc(ACCESORIOS[id]) : "🔒 Por desbloquear") + '</div></div>';
  });
  html += '</div></div>';

  if (estado.sellos.length) {
    html += '<div class="card"><div class="etiqueta">🛂 Sellos de destino</div>';
    estado.sellos.forEach(s => {
      html += '<div style="display:flex;align-items:center;gap:12px;padding:6px 0;"><span style="font-size:1.6rem;">' + s.emoji + '</span><div><div style="font-weight:700;font-size:.92rem;">' + esc(s.destino) + '</div><div style="font-size:.76rem;color:var(--tinta-suave);">' + s.fecha + '</div></div></div>';
    });
    html += '</div>';
  }

  html += '<div class="card"><div class="etiqueta">🧳 Souvenirs</div>';
  if (estado.souvenirs.length) {
    html += '<div class="souvenir-grid">';
    estado.souvenirs.forEach(s => { html += '<div class="souvenir"><div class="e">' + s.emoji + '</div><div class="t">' + esc(s.nombre) + '</div></div>'; });
    html += '</div>';
  } else html += '<p style="font-size:.85rem;color:var(--tinta-suave);">Tu maleta está vacía… por ahora. Juega la primera misión.</p>';
  html += '</div>';

  if (estado.insigniasV1.length) {
    html += '<div class="card"><div class="etiqueta">🏅 Insignias de la era pre-Lucio</div>';
    estado.insigniasV1.forEach(b => { html += '<div style="display:flex;align-items:center;gap:12px;padding:6px 0;"><span style="font-size:1.4rem;">' + b.emoji + '</span><div><div style="font-weight:700;font-size:.9rem;">' + esc(b.nombre) + '</div><div style="font-size:.76rem;color:var(--tinta-suave);">' + esc(b.tema) + ' · ' + b.fecha + '</div></div></div>'; });
    html += '</div>';
  }
  return html;
}
function vestir(id) { estado.accesorioActivo = id; guardar(); render(); }

/* ================= Inicio ================= */
actualizarRacha();
render();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
